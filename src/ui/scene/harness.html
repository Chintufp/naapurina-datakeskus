<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene harness</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../styles/tokens.css">
<link rel="stylesheet" href="../../styles/base.css">
<link rel="stylesheet" href="../../styles/scene.css">
<style>
  body { padding: 16px; }
  .hx { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); max-width: 1240px; margin: 0 auto; }
  .hx__frame { margin: 0 auto; width: 100%; }
  .hx__controls { display: grid; gap: 8px 16px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); font-size: var(--step--1); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .hx__controls label { display: grid; gap: 2px; color: var(--ink-2); }
  .hx__controls select, .hx__controls input[type=range] { width: 100%; }
  .hx__controls select { min-height: 32px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); }
  .hx__aria { font-size: var(--step--1); color: var(--ink-2); }
  h1 { font-size: var(--step-2); }
</style>
</head>
<body>
<div class="hx">
  <h1>Scene harness</h1>
  <div class="hx__frame" id="frame"></div>
  <p class="hx__aria" id="aria"></p>
  <div class="hx__controls" id="controls"></div>
</div>
<script type="module" src="./harness.js"></script>
</body>
</html>
